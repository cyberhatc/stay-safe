name: stay_safe
description: "Stay Safe - Women's Safety App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.4.3

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0

  # Local Storage
  sqflite: ^2.4.4
  path: ^1.9.1
  shared_preferences: ^2.5.5

  # Location & Maps
  geolocator: ^14.1.1
  google_maps_flutter: ^2.18.2

  # Permissions
  permission_handler: ^13.0.2
  flutter_contacts: ^2.5.0

  # Sensors
  sensors_plus: ^7.1.0

  # Audio
  audioplayers: ^6.8.1

  # Background Services
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^22.3.1

  # Battery
  battery_plus: ^7.1.1

  # Utils
  url_launcher: ^6.3.2
  intl: ^0.20.3
  uuid: ^4.6.0
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/
